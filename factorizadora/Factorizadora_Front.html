<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculadora de Factorización · Teorema</title>
    <script>
      window.MathJax = {
        tex: { inlineMath: [["\\(", "\\)"], ["$", "$"]], displayMath: [["\\[", "\\]"]] },
        svg: { fontCache: "global" },
        startup: { typeset: false }
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    <style>
        /* Paleta alineada 1:1 con frontend1.html (Módulo 1) — mismos
           nombres de variable que ya usaba este archivo, así que el
           resto de la hoja de estilos no necesita tocarse. */
        :root {
            --bg: #eef5f7;
            --panel: rgba(255,255,255,.9);
            --panel-dark: #f4f7fb;
            --primary: #124b68;
            --primary-hover: #0b6b6f;
            --success: #137a4b;
            --success-hover: #0e5c38;
            --danger: #b42318;
            --danger-hover: #8f1b12;
            --text: #18202f;
            --text-light: #667085;
            --border: #d9e1ea;
            --accent: #c27a2c;
            --radius: 12px;
        }

        * { box-sizing: border-box; font-family: Inter, "Segoe UI", Arial, sans-serif; }

        body {
            background:
              radial-gradient(circle at top left,  #dfefff 0, transparent 35%),
              radial-gradient(circle at top right, #e7fff7 0, transparent 30%),
              linear-gradient(180deg, #eef5f7 0%, #f8fafc 42%, #fff 100%);
            margin: 0;
            min-height: 100vh;
        }

        /* ── BARRA SUPERIOR (igual receta que frontend1.html / la Calculadora Graficadora) ── */
        .topbar {
            background: linear-gradient(135deg, #0f172a, #124b68 55%, #0b6b6f);
            color: #fff;
            padding: 14px clamp(14px, 4vw, 40px);
            border-bottom: 4px solid var(--accent);
            box-shadow: 0 10px 30px rgba(15,23,42,.18);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            flex-wrap: wrap;
        }
        .topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .topbar-titles h1 { margin: 0; font-size: clamp(17px, 2.2vw, 22px); font-weight: 800; color: #fff; text-align: left; }
        .topbar-titles .subtitle { margin: 2px 0 0; color: rgba(255,255,255,.78); font-size: 12px; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            border: 1px solid rgba(255,255,255,.28);
            background: rgba(255,255,255,.08);
            color: #fff;
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 13px; font-weight: 700;
            cursor: pointer;
            transition: transform .12s, background .12s;
        }
        .back-btn:hover { transform: translateY(-1px); background: rgba(255,255,255,.18); }

        .page-content {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 24px 20px 40px;
        }

        /* Ampliamos el contenedor principal para que quepan ambos teclados a la par */
        .calculator {
            width: 100%;
            max-width: 740px;
            background-color: var(--panel);
            border: 1px solid rgba(217,225,234,.9);
            backdrop-filter: blur(8px);
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 16px 40px rgba(24,32,47,.10);
        }

        #livePreview {
            min-height: 46px;
            color: var(--primary);
            font-weight: 700;
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            background: var(--panel-dark);
            padding: 10px 12px;
            margin-bottom: 14px;
            text-align: left;
            font-size: 16px;
            overflow-x: auto;
            display: flex;
            align-items: center;
        }
        #livePreview.has-error { color: var(--danger); font-size: 12px; font-weight: 600; }
        #livePreview:empty::before { content: "La vista previa aparece aquí mientras escribes"; color: var(--text-light); font-size: 12px; font-weight: 500; }

        .pantalla-input {
            width: 100%;
            background: white;
            border: none;
            border-radius: var(--radius);
            box-shadow: inset 0 2px 5px rgba(0,0,0,.08);
            padding: 18px;
            font-size: 22px;
            font-weight: 500;
            text-align: right;
            margin-bottom: 20px;
            caret-color: var(--primary);
        }

        .calc-heading {
            font-size: 20px;
            text-align: center;
            color: var(--text);
            margin-top: 0;
            margin-bottom: 20px;
        }

        /* Contenedor principal que coloca los dos teclados lado a lado */
        .teclados-contenedor {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .seccion-teclado h3 {
            font-size: 14px;
            color: var(--text-light);
            margin-top: 0;
            margin-bottom: 10px;
            text-align: center;
        }

        .botones, .teclado-avanzado {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        /* Ocupa las 4 columnas del teclado avanzado pero adentro usa su
           propia grilla de 3, así cada potencia queda arriba de su raíz. */
        .grupo-potencias {
            grid-column: span 4;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .tecla {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            padding: 15px 0;
            cursor: pointer;
            transition: transform .12s, border-color .12s, background .12s, color .12s;
        }

        .tecla:hover {
            transform: translateY(-1px);
            border-color: var(--primary);
            background: #f0f7ff;
            color: var(--primary);
        }

        .tecla:active {
            transform: scale(.96);
        }

        /* Limpiar y Resolver ahora van juntos, debajo de los dos
           teclados, en vez de cada uno suelto al fondo de su columna. */
        .acciones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .resolver {
            background: #ecfdf3;
            color: var(--success);
            border: 1px solid #abd9bf;
            font-size: 16px;
            font-weight: 800;
            padding: 15px;
            border-radius: var(--radius);
            cursor: pointer;
            transition: transform .12s, background .12s;
            box-shadow: 0 6px 14px rgba(24,32,47,.07);
        }

        .resolver:hover { transform: translateY(-1px); }
        .resolver:active { background: #dcf7e6; }

        .limpiar {
            background: #fff1f0;
            color: var(--danger);
            border: 1px solid #f4b8b2;
            border-radius: var(--radius);
            font-size: 16px;
            font-weight: 800;
            padding: 15px 0;
            cursor: pointer;
            transition: transform .12s, background .12s;
            box-shadow: 0 6px 14px rgba(24,32,47,.07);
        }

        .limpiar:hover { transform: translateY(-1px); }
        .limpiar:active { background: #ffe3e1; }

        .resultado {
            margin-top: 20px;
            padding: 15px;
            background-color: var(--panel-dark);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            text-align: center;
            min-height: 60px;
        }

        .resultado h2 {
            font-size: 14px;
            color: var(--text-light);
            margin: 0 0 5px 0;
        }

        #texto-resultado {
            font-size: 18px;
            font-weight: bold;
            color: var(--text);
            margin: 0;
            word-break: break-all;
        }


      .btn-volver {
          display: inline-flex;
          align-items: center;
          text-decoration: none;
          color: #124b68;
          font-family: Inter, "Segoe UI", Arial, sans-serif;
          font-weight: 600;
          font-size: 14px;
          padding: 10px; /* Padding igualado para que el botón se vea cuadradito */
          background-color: #ffffff;
          border: 1px solid #d9e1ea;
          border-radius: 8px;
          box-shadow: 0 4px 15px rgba(24, 32, 47, 0.08);
          transition: all 0.3s ease; /* Transición suave */
          overflow: hidden; /* Oculta lo que sobresale */
      }

      .btn-volver:hover {
          background-color: #f0f7ff;
          border-color: #124b68;
          transform: translateY(-2px);
          box-shadow: 0 8px 20px rgba(18, 75, 104, 0.15);
          padding: 10px 16px; /* Al expandirse, recupera el padding horizontal */
      }

      /* Estado inicial del texto: Oculto y sin ancho */
      .btn-texto {
          max-width: 0;
          opacity: 0;
          margin-left: 0;
          white-space: nowrap; /* Evita que el texto salte de línea al animarse */
          transition: all 0.3s ease; /* Misma duración que el hover del botón */
      }

      /* Estado al hacer hover: Aparece el texto y se separa del ícono */
      .btn-volver:hover .btn-texto {
          max-width: 150px; /* Espacio suficiente para "Volver al Menú" */
          opacity: 1;
          margin-left: 8px; /* Esto reemplaza el antiguo 'gap' */
      }

    </style>



    
</head>

    <script>
        /* =====================================================================
           TEOREMA · Motor matemático compartido (idéntico al de la
           Calculadora Graficadora — teorema-math.js) inlineado aquí para
           mantener este archivo autocontenido en un solo HTML, igual que
           el original. Tokeniza/traduce a LaTeX para la vista previa en
           vivo; la factorización en sí la sigue resolviendo el backend
           de Python sin cambios (ver más abajo).
           ===================================================================== */
        const TeoremaMath = (function () {
          "use strict";

          class MathError extends Error {}

          function bigAbs(n) { return n < 0n ? -n : n; }
          function bigGcd(a, b) {
            a = bigAbs(a); b = bigAbs(b);
            while (b) { const t = a % b; a = b; b = t; }
            return a === 0n ? 1n : a;
          }

          class Frac {
            constructor(num, den) {
              if (den === undefined) den = 1n;
              if (den === 0n) throw new MathError("División entre cero.");
              if (den < 0n) { num = -num; den = -den; }
              const g = bigGcd(num, den);
              this.n = num / g;
              this.d = den / g;
            }
            static fromInt(i) { return new Frac(BigInt(i), 1n); }
            add(o) { return new Frac(this.n * o.d + o.n * this.d, this.d * o.d); }
            sub(o) { return new Frac(this.n * o.d - o.n * this.d, this.d * o.d); }
            mul(o) { return new Frac(this.n * o.n, this.d * o.d); }
            div(o) { if (o.n === 0n) throw new MathError("División entre cero."); return new Frac(this.n * o.d, this.d * o.n); }
            neg() { return new Frac(-this.n, this.d); }
            isInt() { return this.d === 1n; }
            isZero() { return this.n === 0n; }
            isNeg() { return this.n < 0n; }
            toNumber() { return Number(this.n) / Number(this.d); }
            toString() { return this.isInt() ? this.n.toString() : `${this.n}/${this.d}`; }
          }

          function bigIntSqrt(n) {
            if (n < 0n) return null;
            if (n < 2n) return n;
            let x0 = n, x1 = (x0 + 1n) / 2n;
            while (x1 < x0) { x0 = x1; x1 = (x0 + n / x0) / 2n; }
            return x0 * x0 === n ? x0 : null;
          }
          function fracSqrt(f) {
            if (f.n < 0n) return null;
            const sn = bigIntSqrt(f.n), sd = bigIntSqrt(f.d);
            if (sn !== null && sd !== null) return new Frac(sn, sd);
            return null;
          }
          function bigFactorial(n) {
            if (n < 0n) throw new MathError("El factorial no está definido para negativos.");
            let r = 1n;
            for (let i = 2n; i <= n; i++) r *= i;
            return r;
          }

          function V_exact(frac) { return { exact: true, frac, value: frac.toNumber() }; }
          function V_float(value) { return { exact: false, frac: null, value }; }
          function toFloatValue(v) { return v.exact ? v.frac.toNumber() : v.value; }

          const FN1 = ["asin", "acos", "atan", "sinh", "cosh", "tanh", "sin", "cos", "tan",
                       "log", "ln", "exp", "sqrt", "cbrt", "abs"];
          const FN2 = ["root", "mod", "gcd", "lcm", "ncr", "npr"];
          const VARIABLES = new Set(["x", "y", "z"]);
          const CONSTANTS = new Set(["pi", "e"]);
          const FN_ALL = [...FN1, ...FN2, ...CONSTANTS].sort((a, b) => b.length - a.length);

          function tokenize(input) {
            const s = String(input || "");
            const tokens = [];
            let i = 0;
            const n = s.length;
            while (i < n) {
              const c = s[i];
              if (c === " " || c === "\t" || c === "\n") { i++; continue; }
              if (c === "π") { tokens.push({ t: "CONST", v: "pi" }); i++; continue; }
              if (/[0-9]/.test(c) || (c === "." && /[0-9]/.test(s[i + 1] || ""))) {
                let j = i;
                while (j < n && /[0-9]/.test(s[j])) j++;
                if (s[j] === ".") { j++; while (j < n && /[0-9]/.test(s[j])) j++; }
                tokens.push({ t: "NUM", v: s.slice(i, j) });
                i = j;
                continue;
              }
              if (/[A-Za-z]/.test(c)) {
                const rest = s.slice(i).toLowerCase();
                const kw = FN_ALL.find(k => rest.startsWith(k));
                if (kw) {
                  if (CONSTANTS.has(kw)) { tokens.push({ t: "CONST", v: kw }); i += kw.length; continue; }
                  tokens.push({ t: "FUNC", v: kw });
                  i += kw.length;
                  continue;
                }
                if (VARIABLES.has(c.toLowerCase())) { tokens.push({ t: "VAR", v: c.toLowerCase() }); i++; continue; }
                throw new MathError(`No reconozco "${c}" en la expresión.`);
              }
              if (c === "*" && s[i + 1] === "*") { tokens.push({ t: "CARET" }); i += 2; continue; }
              if (c === "^") { tokens.push({ t: "CARET" }); i++; continue; }
              if (c === "+") { tokens.push({ t: "PLUS" }); i++; continue; }
              if (c === "-" || c === "−") { tokens.push({ t: "MINUS" }); i++; continue; }
              if (c === "*" || c === "·" || c === "×") { tokens.push({ t: "STAR" }); i++; continue; }
              if (c === "/" || c === "÷") { tokens.push({ t: "SLASH" }); i++; continue; }
              if (c === "(") { tokens.push({ t: "LP" }); i++; continue; }
              if (c === ")") { tokens.push({ t: "RP" }); i++; continue; }
              if (c === ",") { tokens.push({ t: "COMMA" }); i++; continue; }
              if (c === "!") { tokens.push({ t: "BANG" }); i++; continue; }
              if (c === "%") { tokens.push({ t: "PCT" }); i++; continue; }
              if (c === "|") throw new MathError('Usa "abs(...)" para valor absoluto en vez de "|...|".');
              throw new MathError(`No reconozco el símbolo "${c}".`);
            }
            tokens.push({ t: "EOF" });
            return tokens;
          }

          function parse(input) {
            const tokens = tokenize(input);
            let pos = 0;
            const peek = () => tokens[pos];
            const next = () => tokens[pos++];
            const expect = (t, msg) => { if (peek().t !== t) throw new MathError(msg || `Se esperaba "${t}".`); return next(); };

            function canStartUnary(tok) {
              return tok.t === "NUM" || tok.t === "VAR" || tok.t === "CONST" ||
                     tok.t === "LP" || tok.t === "FUNC" ||
                     tok.t === "MINUS" || tok.t === "PLUS";
            }

            function parseExpr() {
              let node = parseTerm();
              while (peek().t === "PLUS" || peek().t === "MINUS") {
                const op = next().t === "PLUS" ? "+" : "-";
                node = { type: "bin", op, l: node, r: parseTerm() };
              }
              return node;
            }
            function parseTerm() {
              let node = parseUnary();
              for (;;) {
                if (peek().t === "STAR") { next(); node = { type: "bin", op: "*", l: node, r: parseUnary() }; continue; }
                if (peek().t === "SLASH") { next(); node = { type: "bin", op: "/", l: node, r: parseUnary() }; continue; }
                if (canStartUnary(peek()) && peek().t !== "MINUS" && peek().t !== "PLUS") {
                  node = { type: "bin", op: "*", implicit: true, l: node, r: parseUnary() };
                  continue;
                }
                break;
              }
              return node;
            }
            function parseUnary() {
              if (peek().t === "MINUS") { next(); return { type: "neg", a: parseUnary() }; }
              if (peek().t === "PLUS") { next(); return parseUnary(); }
              return parsePower();
            }
            function parsePower() {
              const base = parsePostfix();
              if (peek().t === "CARET") { next(); return { type: "bin", op: "^", l: base, r: parseUnary() }; }
              return base;
            }
            function parsePostfix() {
              let node = parseAtom();
              for (;;) {
                if (peek().t === "BANG") { next(); node = { type: "fact", a: node }; continue; }
                if (peek().t === "PCT") { next(); node = { type: "pct", a: node }; continue; }
                break;
              }
              return node;
            }
            function parseAtom() {
              const tok = peek();
              if (tok.t === "NUM") { next(); return { type: "num", v: tok.v }; }
              if (tok.t === "CONST") { next(); return { type: "const", v: tok.v }; }
              if (tok.t === "VAR") { next(); return { type: "var", v: tok.v }; }
              if (tok.t === "LP") {
                next();
                const inner = parseExpr();
                expect("RP", 'Falta un ")".');
                return inner;
              }
              if (tok.t === "FUNC") {
                next();
                expect("LP", `Se esperaba "(" después de "${tok.v}".`);
                const args = [parseExpr()];
                while (peek().t === "COMMA") { next(); args.push(parseExpr()); }
                expect("RP", `Falta un ")" para cerrar "${tok.v}(".`);
                const maxArgs = FN2.includes(tok.v) ? 2 : 1;
                if (args.length > maxArgs) throw new MathError(`"${tok.v}" no acepta tantos argumentos.`);
                return { type: "func", name: tok.v, args };
              }
              throw new MathError("Expresión incompleta.");
            }

            if (peek().t === "EOF") throw new MathError("Escribe una expresión.");
            const ast = parseExpr();
            expect("EOF", "Sobra algo al final de la expresión.");
            return ast;
          }

          function collectVars(node, set) {
            if (!node) return set;
            if (node.type === "var") set.add(node.v);
            if (node.type === "bin") { collectVars(node.l, set); collectVars(node.r, set); }
            if (node.type === "neg" || node.type === "fact" || node.type === "pct") collectVars(node.a, set);
            if (node.type === "func") node.args.forEach(a => collectVars(a, set));
            return set;
          }
          function getVariables(input) {
            try {
              const ast = parse(input);
              return Array.from(collectVars(ast, new Set())).sort();
            } catch (e) {
              return [];
            }
          }

          const FUNC_LATEX = {
            sin: "\\sin", cos: "\\cos", tan: "\\tan",
            asin: "\\arcsin", acos: "\\arccos", atan: "\\arctan",
            sinh: "\\sinh", cosh: "\\cosh", tanh: "\\tanh",
            log: "\\log", ln: "\\ln", exp: "\\exp",
          };
          function prec(node) {
            if (node.type === "bin") return { "+": 1, "-": 1, "*": 2, "/": 2, "^": 4 }[node.op];
            if (node.type === "neg") return 3;
            return 5;
          }
          function toLatexNode(node, parentPrec) {
            let s, p;
            switch (node.type) {
              case "num": s = node.v; p = 5; break;
              case "const": s = node.v === "pi" ? "\\pi" : "e"; p = 5; break;
              case "var": s = node.v; p = 5; break;
              case "neg": s = `-${toLatexNode(node.a, 3)}`; p = 3; break;
              case "fact": s = `${toLatexNode(node.a, 5)}!`; p = 5; break;
              case "pct": s = `${toLatexNode(node.a, 5)}\\%`; p = 5; break;
              case "func": {
                const inner = node.args.map(a => toLatexNode(a, 0)).join(",\\ ");
                if (node.name === "sqrt") { s = `\\sqrt{${inner}}`; p = 5; break; }
                if (node.name === "cbrt") { s = `\\sqrt[3]{${inner}}`; p = 5; break; }
                if (node.name === "root") { s = `\\sqrt[${toLatexNode(node.args[1], 0)}]{${toLatexNode(node.args[0], 0)}}`; p = 5; break; }
                if (node.name === "abs") { s = `\\left|${inner}\\right|`; p = 5; break; }
                if (node.name === "gcd" || node.name === "lcm") { s = `\\operatorname{${node.name}}\\left(${inner}\\right)`; p = 5; break; }
                if (node.name === "ncr") { s = `{}_{${toLatexNode(node.args[0], 0)}}C_{${toLatexNode(node.args[1], 0)}}`; p = 5; break; }
                if (node.name === "npr") { s = `{}_{${toLatexNode(node.args[0], 0)}}P_{${toLatexNode(node.args[1], 0)}}`; p = 5; break; }
                if (node.name === "mod") { s = `${toLatexNode(node.args[0], 2)}\\ \\operatorname{mod}\\ ${toLatexNode(node.args[1], 2)}`; p = 1; break; }
                const fname = FUNC_LATEX[node.name] || `\\operatorname{${node.name}}`;
                s = `${fname}\\left(${inner}\\right)`; p = 5;
                break;
              }
              case "bin": {
                if (node.op === "/") { s = `\\frac{${toLatexNode(node.l, 0)}}{${toLatexNode(node.r, 0)}}`; p = 5; break; }
                if (node.op === "^") {
                  const base = toLatexNode(node.l, 4.5);
                  const exp = toLatexNode(node.r, 0);
                  s = `${base}^{${exp}}`; p = 4;
                  break;
                }
                const opTex = node.op === "*"
                  ? (node.implicit ? "" : "\\cdot ")
                  : { "+": "+", "-": "-" }[node.op];
                const l = toLatexNode(node.l, prec(node));
                const r = toLatexNode(node.r, prec(node) + (node.op === "-" ? 1 : 0));
                s = `${l}${opTex}${r}`;
                p = prec(node);
                break;
              }
              default: s = "?"; p = 5;
            }
            return p < parentPrec ? `\\left(${s}\\right)` : s;
          }

          function toLatex(input) {
            const ast = parse(input);
            return toLatexNode(ast, 0);
          }

          // Traductor a sintaxis segura para el backend — mismas
          // correcciones verificadas contra Calc_fac_back.py: "π"/"e"
          // sueltos el backend los trata como símbolos, no como las
          // constantes reales, y "mod/ncr/npr" no existen con ese
          // nombre en sympy.
          function toBackendNode(node) {
            switch (node.type) {
              case "num": return node.v;
              case "const": return node.v === "pi" ? "pi" : "E";
              case "var": return node.v;
              case "neg": return `-(${toBackendNode(node.a)})`;
              case "fact": return `factorial(${toBackendNode(node.a)})`;
              case "pct": return `((${toBackendNode(node.a)})/100)`;
              case "func": {
                const a = node.args.map(toBackendNode);
                if (node.name === "mod") return `Mod(${a[0]},${a[1]})`;
                if (node.name === "ncr") return `binomial(${a[0]},${a[1]})`;
                if (node.name === "npr") return `(factorial(${a[0]})/factorial((${a[0]})-(${a[1]})))`;
                if (node.name === "cbrt") return `(sign(${a[0]})*Abs(${a[0]})**(1/3))`;
                if (node.name === "root") {
                  const nNode = node.args[1];
                  if (nNode.type === "num" && !nNode.v.includes(".")) {
                    const nInt = parseInt(nNode.v, 10);
                    if (nInt % 2 === 1) return `(sign(${a[0]})*Abs(${a[0]})**(1/${nInt}))`;
                  }
                  return `root(${a[0]},${a[1]})`;
                }
                return `${node.name}(${a.join(",")})`;
              }
              case "bin": {
                const l = toBackendNode(node.l), r = toBackendNode(node.r);
                const op = node.op === "^" ? "**" : node.op;
                return `(${l}${op}${r})`;
              }
              default: throw new MathError("Expresión no reconocida.");
            }
          }
          function toBackendSyntax(input) { return toBackendNode(parse(input)); }

          function formatPreviewLatex(input) {
            if (!input || !input.trim()) return { ok: true, latex: "" };
            try {
              return { ok: true, latex: toLatex(input) };
            } catch (e) {
              return { ok: false, latex: "", error: e.message || "Expresión incompleta." };
            }
          }

          return { MathError, tokenize, parse, toLatex, formatPreviewLatex, getVariables, toBackendSyntax };
        })();
    </script>

    <script>
        // =========================================================================
        // CONFIGURACIÓN DEL BACKEND — EDITAR ESTA LÍNEA AL DESPLEGAR
        // =========================================================================
        // Mismo patrón que frontend1.html: en desarrollo local apunta a
        // 127.0.0.1; al desplegar, cámbialo por la URL pública del backend,
        // sin barra al final.
        window.BACKEND_URL = window.BACKEND_URL || "http://127.0.0.1:5000";
        // =========================================================================

        const API_KEY = "teorema-api-secure-key-123";

        const inputPantalla = document.getElementById('pantalla-input');
        const livePreview = document.getElementById('livePreview');
        const textoResultado = document.getElementById('texto-resultado');
        const botonesTeclas = document.querySelectorAll('.tecla');
        const btnLimpiar = document.getElementById('btn-limpiar');
        const btnResolver = document.getElementById('btn-resolver');

        // Inserta en la posición del cursor (o reemplaza la selección) en
        // vez de solo concatenar al final — mismo patrón que frontend1.html,
        // con offset para dejar el cursor listo dentro de paréntesis recién
        // insertados (p. ej. "sqrt()" deja el cursor entre los paréntesis).
        function insertarEnCursor(texto, offset) {
            offset = offset || 0;
            const s = inputPantalla.selectionStart ?? inputPantalla.value.length;
            const e = inputPantalla.selectionEnd ?? inputPantalla.value.length;
            inputPantalla.value = inputPantalla.value.slice(0, s) + texto + inputPantalla.value.slice(e);
            const next = s + texto.length + offset;
            inputPantalla.focus();
            inputPantalla.setSelectionRange(Math.max(0, next), Math.max(0, next));
            actualizarVistaPrevia();
        }

        function actualizarVistaPrevia() {
            const raw = inputPantalla.value;
            if (!raw.trim()) {
                livePreview.innerHTML = '';
                livePreview.classList.remove('has-error');
                return;
            }
            const r = TeoremaMath.formatPreviewLatex(raw);
            if (r.ok) {
                livePreview.classList.remove('has-error');
                livePreview.innerHTML = `\\[${r.latex}\\]`;
                if (window.MathJax && window.MathJax.typesetPromise) {
                    window.MathJax.typesetPromise([livePreview]).catch(() => {});
                }
            } else {
                livePreview.classList.add('has-error');
                livePreview.textContent = r.error;
            }
        }

        // Escribir en la pantalla desde cualquier teclado
        botonesTeclas.forEach(boton => {
            boton.addEventListener('click', () => {
                const valor = boton.getAttribute('data-val');
                const offset = parseInt(boton.getAttribute('data-offset') || '0', 10);
                insertarEnCursor(valor, offset);
            });
        });

        // También actualizar la vista previa si se escribe directamente
        // en la pantalla (no solo con los botones del teclado).
        inputPantalla.addEventListener('input', actualizarVistaPrevia);

        // Limpiar pantalla
        btnLimpiar.addEventListener('click', () => {
            inputPantalla.value = '';
            inputPantalla.focus();
            actualizarVistaPrevia();
            textoResultado.textContent = '...';
            textoResultado.style.color = 'var(--text)';
        });

        // Resolver enviando al backend de Python (mismo endpoint, mismo
        // método, mismos headers y cuerpo que antes — solo la URL base
        // ahora viene de window.BACKEND_URL en vez de estar fija).
        btnResolver.addEventListener('click', async () => {
            const polinomio = inputPantalla.value;
            let paraBackend = polinomio;
            try { paraBackend = TeoremaMath.toBackendSyntax(polinomio); } catch (e) { /* si no se puede traducir, se manda tal cual */ }
            textoResultado.textContent = 'Calculando...';
            textoResultado.style.color = 'var(--text-light)';

            try {
                const response = await fetch(`${window.BACKEND_URL}/factorizar`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': API_KEY
                    },
                    body: JSON.stringify({ polinomio: paraBackend })
                });

                const resultadoJson = await response.json();

                if (response.ok && resultadoJson.status === 'success') {
  
                    // Convertimos la sintaxis de Python a LaTeX y renderizamos
                    let latexResult = resultadoJson.data;
                    try {
                        latexResult = TeoremaMath.toLatex(resultadoJson.data);
                    } catch(e) {}

                    textoResultado.innerHTML = `\\[${latexResult}\\]`;
                    textoResultado.style.color = 'var(--success)';
                    if (window.MathJax && window.MathJax.typesetPromise) {
                        window.MathJax.typesetPromise([textoResultado]).catch(() => {});
                    }

                } else {
                    textoResultado.textContent = resultadoJson.data;
                    textoResultado.style.color = 'var(--danger)';
                }
            } catch (error) {
                textoResultado.textContent = 'Error de conexión con el servidor Python.';
                textoResultado.style.color = 'var(--danger)';
            }
        });

    </script>
</body>
</html>
